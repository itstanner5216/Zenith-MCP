name: Publish to npm

# Publishes the workspace packages to npm.
#
# Two modes are supported:
#   - stage       -> publishes under the "next" dist-tag (safe staging / pre-release)
#   - production  -> publishes under the "latest" dist-tag (the default install target)
#
# Triggers:
#   - Manual (workflow_dispatch) with a selectable mode + optional dry-run.
#   - Automatic on GitHub Release publish -> always a production publish.
#
# Authentication uses npm Trusted Publishing (OIDC) by default, which requires
# no long-lived secrets. If a repository secret named NPM_TOKEN is present it is
# used instead as a fallback.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode"
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production
      package:
        description: "Which package(s) to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - zenith-mcp
          - zenith-toon
      dry_run:
        description: "Run npm publish with --dry-run (no upload)"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

# Prevent overlapping publishes from racing each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11.13.1"

jobs:
  publish:
    name: Publish (${{ github.event_name == 'release' && 'production' || inputs.mode }})
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve publish parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "package=all" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "production" ]; then
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            else
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            fi
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "package=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing needs a recent npm CLI (>= 11.5.1).
      - name: Upgrade npm (for Trusted Publishing / OIDC)
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MODE: ${{ steps.params.outputs.mode }}
          DIST_TAG: ${{ steps.params.outputs.dist_tag }}
          PACKAGE: ${{ steps.params.outputs.package }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          set -euo pipefail

          echo "Mode:      $MODE"
          echo "Dist-tag:  $DIST_TAG"
          echo "Package:   $PACKAGE"
          echo "Dry run:   $DRY_RUN"

          PUBLISH_ARGS="--access public --tag $DIST_TAG --no-git-checks"
          if [ "$DRY_RUN" = "true" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS --dry-run"
          fi

          # zenith-toon must publish before zenith-mcp (which depends on it).
          publish_one() {
            local dir="$1"
            echo "::group::Publishing $dir"
            ( cd "$dir" && pnpm publish $PUBLISH_ARGS )
            echo "::endgroup::"
          }

          case "$PACKAGE" in
            zenith-toon)
              publish_one packages/zenith-toon
              ;;
            zenith-mcp)
              publish_one packages/zenith-mcp
              ;;
            all)
              publish_one packages/zenith-toon
              publish_one packages/zenith-mcp
              ;;
            *)
              echo "Unknown package: $PACKAGE" >&2
              exit 1
              ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            echo "### npm Publish"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mode | ${{ steps.params.outputs.mode }} |"
            echo "| Dist-tag | ${{ steps.params.outputs.dist_tag }} |"
            echo "| Package | ${{ steps.params.outputs.package }} |"
            echo "| Dry run | ${{ steps.params.outputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
